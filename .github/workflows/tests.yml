name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src tests
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Verify commands
        run: |
          python kimai_api.py --help
          kimai-export --help
          kimai-import-clockify --help
          kimai-import-project-tasks --help
          kimai-prepare-clockify-migration --help
          clockify-backup --help
          clockify-verify-backup --help
